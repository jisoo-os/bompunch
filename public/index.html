<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16a34a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>봄펀치</title>
<style>
:root{--g:#16a34a;--gd:#15803d;--bg:#f4f7f5;--card:#fff;--tx:#111827;--sub:#6b7280;--bd:#e5e7eb;--red:#dc2626;--bl:#2563eb}
@media(prefers-color-scheme:dark){:root{--bg:#0f1512;--card:#18211d;--tx:#f3f4f6;--sub:#9ca3af;--bd:#2a3731}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;padding-bottom:env(safe-area-inset-bottom)}
.wrap{max-width:560px;margin:0 auto;padding:16px}
.wrap.wide{max-width:900px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
header h1{font-size:20px;margin:0;color:var(--g)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:12px}
h2{font-size:15px;margin:0 0 10px}
.sub{color:var(--sub);font-size:13px}
input,select{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;font-size:16px;background:var(--card);color:var(--tx);margin-bottom:8px}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--g);color:#fff;font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--sub);border:1px solid var(--bd)}
button.sm{padding:6px 10px;font-size:13px}
button.danger{background:var(--red)}
button:disabled{opacity:.5}
.clock{text-align:center;font-size:44px;font-weight:700;letter-spacing:1px}
.date{text-align:center;color:var(--sub);margin-bottom:12px}
.punch{width:100%;height:150px;border-radius:24px;font-size:28px;margin-top:8px}
.punch.out{background:var(--bl)}
.msg{text-align:center;min-height:22px;font-size:14px;margin-top:8px}
.msg.err{color:var(--red)}.msg.ok{color:var(--g)}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;background:var(--card);color:var(--sub);border:1px solid var(--bd)}
.tabs button.on{background:var(--g);color:#fff;border-color:var(--g)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 6px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
th{color:var(--sub);font-weight:600}
.scroll{overflow-x:auto}
.row{display:flex;gap:8px}.row>*{flex:1}
.stat{display:flex;justify-content:space-between;padding:6px 0;font-size:15px}
.stat b{font-size:17px}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;background:#dcfce7;color:var(--gd)}
.cur{text-align:center;font-size:20px;font-weight:700;margin-bottom:10px;color:var(--g)}
.cur.brk{color:#b45309}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tk{height:64px;background:var(--bg);color:var(--tx);border:1px solid var(--bd);font-size:15px}
.tk.on{background:var(--g);color:#fff;border-color:var(--g)}
.tk.brkb.on{background:#d97706;border-color:#d97706}
.login-logo{text-align:center;font-size:56px;margin:40px 0 4px}
.login-t{text-align:center;font-size:28px;font-weight:800;color:var(--g);margin-bottom:24px}
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<script>
const TKEY='bompunch_token';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won=n=>Math.round(n).toLocaleString('ko-KR')+'원';
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hm=ts=>{const d=new Date(ts);return `${pad(d.getHours())}:${pad(d.getMinutes())}`};
const fmtMin=m=>`${Math.floor(m/60)}시간 ${m%60}분`;

let token=(()=>{try{return localStorage.getItem(TKEY)}catch(e){return null}})();
let S=null;                       // 서버에서 받은 상태
let ui={tab:'today',month:ymd(new Date()).slice(0,7),msg:'',err:false,busy:false};

async function api(method,url,body){
  const r=await fetch(url,{method,headers:{'content-type':'application/json',...(token?{authorization:'Bearer '+token}:{})},body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({}));
  if(r.status===401&&token&&url!=='/api/login'){logout();ui.msg='다시 로그인해 주세요.';ui.err=true;render()}
  if(!r.ok)throw new Error(j.error||'오류가 발생했습니다.');
  return j;
}
async function refresh(){S=await api('GET','/api/state');render()}

/* ---------- 계산 (표시용) ---------- */
// 4시간 이상 30분, 8시간 이상 60분 휴게 차감 / 8시간 초과분 1.5배
function calc(r,wage){
  if(!r.out)return null;
  const total=Math.max(0,Math.round((r.out-r.in)/60000));
  // 휴게 버튼을 누른 기록이 있으면 그 시간만, 없으면 법정 기준으로 자동 차감
  const bseg=(r.segments||[]).filter(s=>s.task==='break'&&s.end).reduce((a,s)=>a+Math.round((s.end-s.start)/60000),0);
  const brk=bseg>0?Math.min(bseg,total):(total>=480?60:total>=240?30:0);
  const net=total-brk, reg=Math.min(net,480), ot=Math.max(net-480,0);
  return {total,brk,net,reg,ot,pay:wage*reg/60+wage*1.5*ot/60};
}
// 정밀 위치(GPS)를 먼저 시도하고, 실패하면 Wi-Fi/기지국 기반 위치로 한 번 더 시도
function getPos(){
  const once=opt=>new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(p=>res(p.coords),rej,opt));
  const msg=e=>e.code==1?'위치 권한이 꺼져 있습니다. 브라우저 주소창 옆 자물쇠 → 사이트 설정에서 위치를 "허용"으로 바꿔 주세요.'
    :e.code==3?'위치 확인이 너무 오래 걸립니다. 창가나 실외로 이동해서 다시 눌러 주세요.'
    :'위치를 가져오지 못했습니다. 폰의 위치(GPS) 기능이 켜져 있는지 확인해 주세요.';
  if(!navigator.geolocation)return Promise.reject(new Error('이 기기는 위치 기능을 지원하지 않습니다.'));
  return once({enableHighAccuracy:true,timeout:12000,maximumAge:0}).catch(e=>{
    if(e.code==1)throw new Error(msg(e));
    return once({enableHighAccuracy:false,timeout:20000,maximumAge:60000}).catch(e2=>{throw new Error(msg(e2))});
  });
}

/* ---------- 화면 ---------- */
function render(){
  const a=$('#app');
  a.className='wrap'+(S&&S.role==='admin'?' wide':'');
  if(!token||!S){a.innerHTML=loginView();return}
  a.innerHTML=S.role==='admin'?adminView():workerView();
  tick();tickSeg();
}
function loginView(){
  return `<div class="login-logo">🌸</div><div class="login-t">봄펀치</div>
  <div class="card"><h2>직원 로그인</h2>
    <input id="ln" placeholder="이름" autocomplete="username">
    <input id="lp" type="password" inputmode="numeric" maxlength="8" placeholder="PIN 번호" autocomplete="current-password">
    <button style="width:100%" data-act="wlogin">로그인</button></div>
  <div class="card"><h2>관리자</h2>
    <input id="ap" type="password" inputmode="numeric" placeholder="관리자 PIN">
    <button class="ghost" style="width:100%" data-act="alogin">관리자 로그인</button></div>
  <div class="msg ${ui.err?'err':'ok'}">${esc(ui.msg)}</div>`;
}
// 작업별 누적 분: {이름: 분}
function taskTotals(records){
  const m={};
  records.forEach(r=>(r.segments||[]).forEach(s=>{
    const mins=Math.round(((s.end||Date.now())-s.start)/60000);
    if(mins>0)m[s.name]=(m[s.name]||0)+mins;
  }));
  return Object.entries(m).sort((a,b)=>b[1]-a[1]);
}
const taskRows=list=>list.map(([n,m])=>`<div class="stat"><span>${esc(n)}</span><b>${fmtMin(m)}</b></div>`).join('');
const curSeg=r=>r&&(r.segments||[]).find(s=>!s.end);

function workerView(){
  const w=S.me;
  const open=S.records.find(r=>!r.out);
  const seg=curSeg(open);
  const taskPanel=open?`<div class="card"><h2>지금 작업</h2>
    <div class="cur ${seg&&seg.task==='break'?'brk':''}">${seg?`${esc(seg.name)} · <span id="seg" data-start="${seg.start}">00:00:00</span>`:'<span class="sub">작업을 선택하면 시간이 측정됩니다</span>'}</div>
    <div class="grid">${S.tasks.map(t=>`<button class="tk ${seg&&seg.task===t.id?'on':''}" data-act="task" data-id="${t.id}">${esc(t.name)}</button>`).join('')}
      <button class="tk brkb ${seg&&seg.task==='break'?'on':''}" data-act="task" data-id="break">☕ 휴게</button></div>
    ${seg?'<button class="ghost" style="width:100%;margin-top:8px" data-act="task" data-id="stop">작업 끝내기</button>':''}
  </div>`:'';
  const totals=taskTotals(S.records.filter(r=>r.date.startsWith(ui.month)));
  const mine=S.records.filter(r=>r.date.startsWith(ui.month)).sort((a,b)=>b.in-a.in);
  let tm=0,tp=0;
  const rows=mine.map(r=>{const c=calc(r,w.wage);if(c){tm+=c.net;tp+=c.pay}
    return `<tr><td>${r.date.slice(5)}</td><td>${hm(r.in)}</td><td>${r.out?hm(r.out):'-'}</td><td>${c?fmtMin(c.net):'근무중'}</td><td>${c?won(c.pay):''}</td></tr>`}).join('');
  return `<header><h1>🌸 봄펀치</h1><button class="ghost sm" data-act="logout">로그아웃</button></header>
  <div class="card"><div class="sub" style="text-align:center">${esc(w.name)}님 · ${esc(S.settings.name)}</div>
    <div class="clock" id="clock"></div><div class="date" id="date"></div>
    <button class="punch ${open?'out':''}" data-act="${open?'out':'in'}" id="pb" ${ui.busy?'disabled':''}>${open?'퇴근하기':'출근하기'}</button>
    <div class="msg ${ui.err?'err':'ok'}" id="msg">${esc(ui.msg)}</div>
    ${open?`<div class="sub" style="text-align:center">출근 ${hm(open.in)} · 근무중</div>`:''}
  </div>
  ${taskPanel}
  <div class="card"><div class="row"><h2 style="align-self:center">내 근무</h2><input type="month" id="mon" value="${ui.month}"></div>
    <div class="stat"><span>총 근무시간(휴게 제외)</span><b>${fmtMin(tm)}</b></div>
    <div class="stat"><span>예상 급여</span><b>${won(tp)}</b></div>
    <div class="sub">시급 ${won(w.wage)} · 8시간 초과분 1.5배 · 주휴수당·세금 미포함</div>
  </div>
  ${totals.length?`<div class="card"><h2>이번 달 작업별 시간</h2>${taskRows(totals)}</div>`:''}
  <div class="card scroll"><table><tr><th>일</th><th>출근</th><th>퇴근</th><th>근무</th><th>급여</th></tr>${rows||'<tr><td colspan=5 class="sub">기록이 없습니다</td></tr>'}</table></div>`;
}
function adminView(){
  const tabs=[['today','오늘'],['month','월 정산'],['workers','직원'],['settings','설정']];
  const wm=Object.fromEntries(S.workers.map(w=>[w.id,w]));
  let body='';
  if(ui.tab==='today'){
    const t=ymd(new Date());
    const rs=S.records.filter(r=>r.date===t).sort((a,b)=>a.in-b.in);
    const rows=rs.map(r=>{const w=wm[r.wid];
      return `<tr><td>${esc(w?w.name:'?')}${r.manual?' <span class="sub">(수동)</span>':''}</td><td>${hm(r.in)}</td><td>${r.out?hm(r.out):'<span class="tag">근무중</span>'}</td>
      <td>${r.out?'':(curSeg(r)?esc(curSeg(r).name):'<span class="sub">-</span>')}</td>
      <td><button class="sm ghost" data-act="delrec" data-id="${r.id}">삭제</button></td></tr>`}).join('');
    const opts=S.workers.map(w=>`<option value="${w.id}">${esc(w.name)}</option>`).join('');
    body=`<div class="card"><h2>오늘 (${t}) 출퇴근 · ${rs.filter(r=>!r.out).length}명 근무중</h2>
      <div class="scroll"><table><tr><th>이름</th><th>출근</th><th>퇴근</th><th>현재 작업</th><th></th></tr>${rows||'<tr><td colspan=5 class="sub">아직 기록이 없습니다</td></tr>'}</table></div></div>
      <div class="card"><h2>누락된 기록 직접 입력</h2>
        <select id="mw"><option value="">직원 선택</option>${opts}</select>
        <input type="date" id="md" value="${t}">
        <div class="row"><input type="time" id="mi" value="09:00"><input type="time" id="mo" value="18:00"></div>
        <button style="width:100%" data-act="addrec">추가</button></div>`;
  }
  if(ui.tab==='month'){
    let gm=0,gp=0;
    const rows=S.workers.map(w=>{
      const rs=S.records.filter(r=>r.wid===w.id&&r.date.startsWith(ui.month));
      let n=0,reg=0,ot=0,pay=0;
      rs.forEach(r=>{const c=calc(r,w.wage);if(c){n++;reg+=c.reg;ot+=c.ot;pay+=c.pay}});
      gm+=reg+ot;gp+=pay;
      return `<tr><td>${esc(w.name)}</td><td>${n}일</td><td>${fmtMin(reg)}</td><td>${fmtMin(ot)}</td><td>${won(w.wage)}</td><td><b>${won(pay)}</b></td></tr>`}).join('');
    body=`<div class="card"><div class="row"><input type="month" id="mon" value="${ui.month}"><button data-act="csv" style="margin-bottom:8px">CSV 내려받기</button></div>
      <div class="scroll"><table><tr><th>이름</th><th>출근일</th><th>기본</th><th>연장</th><th>시급</th><th>급여</th></tr>
      ${rows||'<tr><td colspan=6 class="sub">직원을 먼저 등록하세요</td></tr>'}</table></div>
      <div class="stat" style="margin-top:8px"><span>합계 ${fmtMin(gm)}</span><b>${won(gp)}</b></div>
      <div class="sub">휴게 버튼 기록이 있으면 그 시간만, 없으면 자동차감(4h↑30분, 8h↑60분). 8h 초과 1.5배. 주휴·야간·휴일가산, 4대보험·세금은 미포함이니 최종 급여는 확인 후 지급하세요.</div></div>
      ${(()=>{const t=taskTotals(S.records.filter(r=>r.date.startsWith(ui.month)));return t.length?`<div class="card"><h2>작업별 총 시간 (전 직원)</h2>${taskRows(t)}</div>`:''})()}`;
  }
  if(ui.tab==='workers'){
    const rows=S.workers.map(w=>`<tr><td>${esc(w.name)}</td><td>${won(w.wage)}</td>
      <td><button class="sm ghost" data-act="wage" data-id="${w.id}">시급</button> <button class="sm ghost" data-act="resetpin" data-id="${w.id}">PIN 재설정</button> <button class="sm danger" data-act="delw" data-id="${w.id}">삭제</button></td></tr>`).join('');
    body=`<div class="card"><h2>직원 추가</h2>
      <input id="nn" placeholder="이름"><div class="row"><input id="np" inputmode="numeric" maxlength="8" placeholder="PIN(숫자 4~8자리)"><input id="nw" inputmode="numeric" placeholder="시급" value="${S.settings.minWage}"></div>
      <button style="width:100%" data-act="addw">추가</button></div>
      <div class="card scroll"><table><tr><th>이름</th><th>시급</th><th></th></tr>${rows||'<tr><td colspan=3 class="sub">등록된 직원이 없습니다</td></tr>'}</table></div>`;
  }
  if(ui.tab==='settings'){
    const s=S.settings;
    body=`<div class="card"><h2>작업 종류 (직원 화면의 작업 버튼)</h2>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px">${S.tasks.map(t=>`<span class="tag" style="font-size:14px;padding:6px 10px">${esc(t.name)} <a href="#" data-act="deltask" data-id="${t.id}" style="color:var(--red);text-decoration:none;margin-left:4px">✕</a></span>`).join('')||'<span class="sub">작업이 없습니다</span>'}</div>
      <div class="row"><input id="tn" placeholder="새 작업 이름 (예: 검수)"><button data-act="addtask" style="margin-bottom:8px;flex:0 0 80px">추가</button></div>
      <div class="sub">"휴게" 버튼은 기본으로 들어 있습니다. 작업을 지워도 지난 기록의 작업 이름은 그대로 남습니다.</div></div>
      <div class="card"><h2>근무지</h2>
      <input id="sn" value="${esc(s.name)}" placeholder="근무지 이름">
      <div class="sub" style="margin-bottom:8px">${s.hasLoc?'📍 근무지 위치가 설정되어 있습니다.':'⚠️ 근무지 위치가 없어 현재는 어디서나 펀치할 수 있습니다.'}</div>
      <button class="ghost" style="width:100%;margin-bottom:8px" data-act="setloc">📍 지금 내 위치를 근무지로 설정 (근무지에서 누르세요)</button>
      <label class="sub">허용 반경(m)</label><input id="sr" inputmode="numeric" value="${s.radius}">
      <label class="sub">기본 시급(원)</label><input id="sm" inputmode="numeric" value="${s.minWage}">
      <label class="sub">관리자 PIN 변경 (바꿀 때만 입력)</label><input id="sp" type="password" inputmode="numeric" placeholder="새 PIN" autocomplete="new-password">
      <button style="width:100%" data-act="savesettings">저장</button>
      <div class="msg ${ui.err?'err':'ok'}">${esc(ui.msg)}</div></div>`;
  }
  return `<header><h1>🌸 봄펀치 관리자</h1><button class="ghost sm" data-act="logout">로그아웃</button></header>
  <div class="tabs">${tabs.map(([k,l])=>`<button class="${ui.tab===k?'on':''}" data-act="tab" data-id="${k}">${l}</button>`).join('')}</div>${body}`;
}
function tick(){
  const c=$('#clock'),d=$('#date');if(!c)return;
  const n=new Date();c.textContent=`${pad(n.getHours())}:${pad(n.getMinutes())}:${pad(n.getSeconds())}`;
  d.textContent=n.toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'long'});
}
function tickSeg(){
  const e=$('#seg');if(!e)return;
  const s=Math.max(0,Math.floor((Date.now()-Number(e.dataset.start))/1000));
  e.textContent=`${pad(Math.floor(s/3600))}:${pad(Math.floor(s%3600/60))}:${pad(s%60)}`;
}
setInterval(tickSeg,1000);
setInterval(tick,1000);
setInterval(()=>{ // 관리자 '오늘' 화면은 입력 중이 아닐 때 자동 새로고침
  if(S&&S.role==='admin'&&ui.tab==='today'&&!document.activeElement.matches('input,select'))refresh().catch(()=>{});
},30000);

/* ---------- 동작 ---------- */
function logout(){token=null;S=null;try{localStorage.removeItem(TKEY)}catch(e){}ui.msg='';ui.err=false;render()}
function setMsg(m,err){ui.msg=m;ui.err=!!err;const e=$('#msg');if(e){e.textContent=m;e.className='msg '+(err?'err':'ok')}}
async function login(body){
  try{const r=await api('POST','/api/login',body);token=r.token;try{localStorage.setItem(TKEY,token)}catch(e){}
    ui.msg='';ui.tab='today';await refresh()}
  catch(e){ui.msg=e.message;ui.err=true;render()}
}
async function punch(kind){
  ui.busy=true;const btn=$('#pb');btn.disabled=true;setMsg('위치 확인 중…');
  try{
    const body={kind};
    if(S.settings.hasLoc){const p=await getPos();body.lat=p.latitude;body.lng=p.longitude;body.acc=p.accuracy}
    const r=await api('POST','/api/punch',body);
    ui.msg=kind==='in'?`출근 완료 ${hm(r.at)}`:`퇴근 완료 ${hm(r.at)} · 수고하셨습니다!`;ui.err=false;
    ui.busy=false;await refresh();
  }catch(e){ui.busy=false;btn.disabled=false;setMsg(e.message,true)}
}
function downloadCSV(){
  const wm=Object.fromEntries(S.workers.map(w=>[w.id,w]));
  const recs=S.records.filter(r=>r.date.startsWith(ui.month)&&r.out&&wm[r.wid]).sort((a,b)=>a.in-b.in);
  const names=taskTotals(recs).map(x=>x[0]);   // 작업별 열: 이번 달 많이 쓴 작업 순
  const segMin=(r,n)=>(r.segments||[]).filter(s=>s.name===n).reduce((a,s)=>a+Math.round(((s.end||r.out)-s.start)/60000),0);
  const lines=[['이름','날짜','출근','퇴근','총분','휴게분','기본분','연장분','시급','급여',...names.map(n=>n+'(분)')]];
  recs.forEach(r=>{
    const w=wm[r.wid],c=calc(r,w.wage);lines.push([w.name,r.date,hm(r.in),hm(r.out),c.total,c.brk,c.reg,c.ot,w.wage,Math.round(c.pay),...names.map(n=>segMin(r,n)||'')])});
  const csv='﻿'+lines.map(l=>l.map(v=>{v=String(v);if(/^[=+\-@]/.test(v))v="'"+v;return `"${v.replace(/"/g,'""')}"`}).join(',')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download=`봄펀치_${ui.month}.csv`;a.click();
}
async function run(fn,okMsg){
  try{await fn();ui.msg=okMsg||'';ui.err=false;await refresh()}
  catch(e){ui.msg=e.message;ui.err=true;render();if(ui.tab!=='settings')alert(e.message)}
}

document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const act=b.dataset.act,id=b.dataset.id;ui.msg='';
  if(act==='wlogin')login({name:$('#ln').value,pin:$('#lp').value});
  else if(act==='alogin')login({admin:true,pin:$('#ap').value});
  else if(act==='logout')logout();
  else if(act==='in'||act==='out')punch(act);
  else if(act==='tab'){ui.tab=id;render()}
  else if(act==='task'){
    e.preventDefault();
    try{await api('POST','/api/task',{taskId:id});await refresh()}
    catch(er){alert(er.message);refresh().catch(()=>{})}
  }
  else if(act==='addtask'){const v=$('#tn').value;run(()=>api('POST','/api/admin/tasks',{name:v}))}
  else if(act==='deltask'){e.preventDefault();if(confirm('이 작업 버튼을 지울까요? 지난 기록은 그대로 남습니다.'))run(()=>api('DELETE','/api/admin/tasks/'+id))}
  else if(act==='csv')downloadCSV();
  else if(act==='delrec'){if(confirm('이 기록을 삭제할까요?'))run(()=>api('DELETE','/api/admin/records/'+id))}
  else if(act==='delw'){if(confirm('직원과 모든 근무기록을 삭제할까요? 되돌릴 수 없습니다.'))run(()=>api('DELETE','/api/admin/workers/'+id))}
  else if(act==='addw')run(()=>api('POST','/api/admin/workers',{name:$('#nn').value,pin:$('#np').value,wage:$('#nw').value}));
  else if(act==='wage'){const v=prompt('새 시급(원)');if(v)run(()=>api('PATCH','/api/admin/workers/'+id,{wage:v}))}
  else if(act==='resetpin'){const v=prompt('새 PIN (숫자 4~8자리)');if(v)run(()=>api('PATCH','/api/admin/workers/'+id,{pin:v}),'PIN을 바꿨습니다.')}
  else if(act==='addrec'){
    const wid=$('#mw').value;if(!wid)return alert('직원을 선택하세요.');
    run(()=>api('POST','/api/admin/records',{wid,date:$('#md').value,in:$('#mi').value,out:$('#mo').value}));
  }
  else if(act==='setloc'){
    b.disabled=true;
    try{const p=await getPos();await api('PUT','/api/admin/settings',{lat:p.latitude,lng:p.longitude});ui.msg='근무지 위치를 저장했습니다.';ui.err=false;await refresh()}
    catch(er){ui.msg=er.message;ui.err=true;render()}
  }
  else if(act==='savesettings'){
    const body={name:$('#sn').value,radius:$('#sr').value,minWage:$('#sm').value};
    if($('#sp').value)body.adminPin=$('#sp').value;
    run(()=>api('PUT','/api/admin/settings',body),'저장했습니다.');
  }
});
document.addEventListener('change',e=>{if(e.target.id==='mon'&&e.target.value){ui.month=e.target.value;render()}});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  if(e.target.id==='lp'||e.target.id==='ln')login({name:$('#ln').value,pin:$('#lp').value});
  else if(e.target.id==='ap')login({admin:true,pin:$('#ap').value});
});

if(token)refresh().catch(()=>{token=null;render()});else render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
